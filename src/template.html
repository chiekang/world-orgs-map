<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>World of International Organizations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#E8766A; --on-accent:#fff; --hero-ink:#fff;
  --bg:#E7E9EC; --panel:#ffffff; --ink:#222222; --muted:#6d7178; --line:#dfe1e5; --soft:#F2F3F5;
  --navy:var(--accent); --land:color-mix(in srgb,var(--accent) 3%,#fff); --land-stroke:color-mix(in srgb,var(--accent) 32%,#c4c9cf); --ocean:color-mix(in srgb,var(--accent) 34%,#e9eef3);
  --r-sm:5px; --r-md:8px; --r-lg:16px; --sp:12px; --shadow-sm:0 2px 8px rgba(30,35,45,.08); --arc:var(--accent);
  --coral:#E8766A; --mustard:#EBB015; --mint:#5BB89A; --char:#2A2D31;
  --t1:var(--accent); --t2:color-mix(in srgb,var(--accent) 58%,#fff); --t3:color-mix(in srgb,var(--accent) 28%,#fff); --t4:#2A2D31;
  --cA:#E8766A; --cB:#EBB015; --cC:#5BB89A; --cX:#2A2D31;
  --good:#2E9E7F; --bad:#D4503F;
  --radius:6px; --shadow:0 10px 28px rgba(30,35,45,.10);
  font-family: "Roboto","Montserrat","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
[data-theme="mustard"]{--accent:#EBB015;--on-accent:#2B2100;--hero-ink:#2B2100}
[data-theme="mint"]{--accent:#5BB89A;--on-accent:#fff;--hero-ink:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;min-height:100%;padding:16px 18px 24px;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
header.hero{position:relative;overflow:hidden;background:var(--accent);color:var(--hero-ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 28px 26px;display:flex;flex-direction:column;gap:30px;flex-shrink:0}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:2}
.qr{width:92px;height:92px;background:#fff;padding:8px;border-radius:3px;box-shadow:0 4px 12px rgba(0,0,0,.12);flex-shrink:0}
.qr svg{width:100%;height:100%;display:block}
.hero-ctl{flex-shrink:0;margin-left:auto;display:flex;align-items:center;gap:12px}
.themes{display:flex;gap:7px}
.themes button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.themes button[data-t="coral"]{background:#E8766A}
.themes button[data-t="mustard"]{background:#EBB015}
.themes button[data-t="mint"]{background:#5BB89A}
.themes button.on{outline:2px solid #222;outline-offset:2px}
.hero-mid{position:relative;z-index:2;max-width:70%}
header h1{font-family:"Montserrat","Noto Sans TC","PingFang TC",sans-serif;font-size:54px;margin:0 0 8px;font-weight:800;line-height:1.1;letter-spacing:.01em;color:var(--hero-ink)}
.tagline{margin:0;font-size:16px;font-weight:500;max-width:560px;line-height:1.6;color:var(--hero-ink);opacity:.92}
.hero-brand{position:relative;z-index:2;display:flex;align-items:center;gap:10px;min-width:0;font-size:14px;line-height:1.4;font-weight:700;letter-spacing:.02em;color:var(--hero-ink)}
.hero-brand svg{width:26px;height:26px;flex-shrink:0}
.hero-brand b{display:block;font-size:13px;font-weight:700;letter-spacing:.02em}
.giant{position:absolute;right:-26px;bottom:-62px;font-family:"Montserrat",sans-serif;font-weight:900;font-size:250px;line-height:1;letter-spacing:-.03em;color:#fff;z-index:1;white-space:nowrap;user-select:none;pointer-events:none}
.herostats{position:absolute;z-index:2;right:28px;top:24px;display:none}
.lang{display:flex;border:1.5px solid currentColor;border-radius:999px;overflow:hidden;flex-shrink:0;background:transparent}
.lang button{border:0;background:none;padding:5px 12px;font-size:12px;font-weight:700;color:var(--hero-ink)}
.lang button.on{background:#fff;color:#222}
.stats-line{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.stats-line div{font-size:12px;font-weight:500;color:var(--hero-ink)}
.stats-line b{display:block;font-family:"Montserrat",sans-serif;font-size:26px;font-weight:800;line-height:1.1}
nav.modes{flex-shrink:0;display:flex;gap:8px;flex-wrap:wrap}
nav.modes button{flex:0 1 150px;border:0;background:#fff;border-radius:var(--radius);padding:11px 8px;font-size:14px;font-weight:700;color:var(--muted);box-shadow:0 2px 8px rgba(30,35,45,.06);transition:background .15s,color .15s}
nav.modes button.on{background:var(--accent);color:var(--on-accent)}
.toolbar{flex-shrink:0;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:15px;font-weight:500;background:var(--soft);outline:none;color:var(--ink)}
.search input:focus{background:#fff;border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:13px;width:17px;height:17px;stroke:var(--muted)}
.suggest{position:absolute;z-index:30;left:0;right:0;top:48px;background:#fff;border-radius:6px;box-shadow:0 14px 34px rgba(30,35,45,.18);max-height:260px;overflow:auto;display:none}
.suggest button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;font-size:15px;font-weight:500}
.suggest button:hover,.suggest button:focus{background:var(--soft)}
.groups{display:flex;flex-direction:column;gap:8px}
.group{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.group::-webkit-scrollbar{display:none}
.group .glabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex-shrink:0;width:84px}
.chip{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap;min-height:36px;color:var(--ink);transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.hint{font-size:12px;font-weight:500;color:var(--muted)}
main{flex:1;display:flex;min-height:0;position:relative;gap:16px;align-items:stretch}
#mapwrap{flex:1;position:relative;min-height:340px;background:var(--ocean);overflow:hidden;touch-action:none;border-radius:var(--radius);box-shadow:var(--shadow)}
#map{width:100%;height:100%;display:block}
.country{stroke:var(--land-stroke);stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .25s}
.country:hover{filter:brightness(.94)}
.country.sel{stroke:#222;stroke-width:1.5}
.smalldot{vector-effect:non-scaling-stroke;cursor:pointer}
.zoombtns{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:38px;height:38px;border-radius:6px;border:0;background:#fff;font-size:20px;font-weight:500;line-height:1;box-shadow:0 3px 10px rgba(30,35,45,.15);color:#222}
.zoombtns button:hover{background:var(--accent);color:var(--on-accent)}
.legend{position:absolute;left:12px;bottom:12px;background:#fff;border-radius:6px;padding:9px 12px;font-size:12px;font-weight:500;max-width:calc(100% - 24px);box-shadow:0 3px 10px rgba(30,35,45,.15)}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend i{display:inline-block;width:14px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.12)}
.asof{position:absolute;right:12px;bottom:12px;font-size:11px;font-weight:500;color:var(--muted);background:rgba(255,255,255,.9);padding:3px 9px;border-radius:4px}
aside#panel{width:390px;flex-shrink:0;overflow:auto;padding:0 2px 8px 0}
.card{border-radius:var(--radius);padding:18px;margin-bottom:14px;background:#fff;box-shadow:var(--shadow)}
.card h2{font-size:24px;margin:0 0 2px;color:var(--ink);font-weight:800;letter-spacing:.01em}
.card h2+.sub{color:var(--accent);font-weight:700;letter-spacing:.02em}
.card h3{font-size:14px;margin:0 0 6px;font-weight:800}
.sub{font-size:13px;font-weight:400;color:var(--muted);margin:0 0 10px;line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0;padding-top:12px;border-top:1px solid var(--line)}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:var(--soft);border-radius:6px;padding:12px;border-left:4px solid var(--accent)}
.stats .stat:nth-child(2){border-left-color:var(--char)}
.stat b{display:block;font-family:"Montserrat",sans-serif;font-size:26px;color:var(--ink);font-weight:800}
.stat span{font-size:12px;font-weight:500;color:var(--muted)}
.bar{height:5px;background:#dfe1e5;border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
details{margin-top:12px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;color:var(--ink);padding:4px 0}
.members{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.members button{border:0;background:var(--soft);border-radius:4px;padding:4px 9px;font-size:12px;font-weight:500}
.members button:hover{background:var(--accent);color:var(--on-accent)}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:4px;color:#fff;font-weight:600;vertical-align:middle;max-width:46%;text-align:center;line-height:1.3;flex-shrink:0}
.tag.light{color:#222}
.orglist{list-style:none;padding:0;margin:8px 0 0}
.orglist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:500}
.orglist li small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.flag{width:46px;height:auto;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12);vertical-align:middle}
.ctitle{display:flex;gap:12px;align-items:center}
.close{float:right;border:0;background:var(--soft);border-radius:50%;width:28px;height:28px;font-size:17px;line-height:1;color:var(--muted);padding:0}
.close:hover{background:var(--accent);color:var(--on-accent)}
.cmpcount{font-size:14px;font-weight:500;margin:6px 0}
.cmpcount div{display:flex;align-items:center;gap:8px;margin:4px 0}
.cmpcount i{width:14px;height:11px;border-radius:2px;display:inline-block}
.quiz .q{font-size:17px;font-weight:700;margin:6px 0 12px;line-height:1.45}
.quiz .opts{display:grid;gap:8px}
.quiz .opts button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:12px 14px;font-size:15px;font-weight:600;text-align:left;min-height:46px}
.quiz .opts button:hover{border-color:var(--accent)}
.quiz .opts button.right{background:var(--mint);border-color:var(--mint);color:#fff}
.quiz .opts button.wrong{background:var(--coral);border-color:var(--coral);color:#fff}
.quiz .fb{margin-top:12px;font-size:14px;min-height:20px}
.quiz .score{display:flex;gap:12px;font-size:13px;font-weight:500;color:var(--muted)}
.quiz .score b{color:var(--ink);font-size:17px}
.primary{border:0;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:13px 16px;font-size:15px;font-weight:700;margin-top:12px;width:100%;letter-spacing:.02em}
.primary:hover{filter:brightness(.95)}
.note{font-size:12px;font-weight:400;color:var(--muted);margin-top:8px;line-height:1.5}
.empty{color:var(--ink);font-size:14px;font-weight:500;line-height:1.6;margin:0}
.tip{position:absolute;pointer-events:none;background:#222;color:#fff;font-size:12px;font-weight:500;padding:5px 10px;border-radius:4px;white-space:nowrap;display:none;z-index:20}
/*PHASE2*/
.meet{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:16px 18px;margin:12px 0;position:relative;overflow:hidden}
.meet .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.meet .nm{font-weight:800;font-size:17px;margin:4px 0}
.meet .wh{font-size:13px;font-weight:500;line-height:1.6}
.meet .cd{font-family:"Montserrat",sans-serif;font-size:44px;font-weight:900;line-height:1.05;margin-top:10px}
.meet .cd small{font-family:inherit;font-size:13px;font-weight:600;margin-left:4px}
.meet a{color:inherit !important;opacity:.8 !important}
.meet.past{background:#8c9097;color:#fff}
.hot{background:var(--soft);border-radius:6px;padding:12px 14px;margin:10px 0;border-left:4px solid var(--accent)}
.hot b{display:block;font-size:14px;font-weight:700}
.hot p{margin:4px 0;font-size:13px;line-height:1.6;color:#3b3f45}
.hot .qq{font-size:13px;color:var(--ink);font-weight:600}
.hot a{font-size:12px;font-weight:500;color:var(--muted)}
.tl{list-style:none;margin:8px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;margin:0 0 10px;font-size:13px;line-height:1.55}
.tl li:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl b{color:var(--ink);margin-right:6px;font-weight:800}
.uplist{list-style:none;margin:10px 0 0;padding:0}
.uplist li{margin:0}
.uplist li button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px}
.uplist li button:hover{background:var(--soft)}
.uplist .d{font-family:"Montserrat",sans-serif;font-weight:800;color:var(--accent);font-size:20px;min-width:58px;text-align:right;white-space:nowrap;flex-shrink:0}
.uplist .d small{display:block;font-family:"Roboto","Noto Sans TC",sans-serif;font-size:11px;font-weight:500;color:var(--muted)}
.uplist .m{font-size:14px;font-weight:600}.uplist .m small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.presets{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.presets button{flex-shrink:0;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.presets button:hover{border-color:var(--accent)}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.subtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rk{width:100%;border-collapse:collapse;font-size:14px;font-weight:500}
.rk td{padding:8px 4px;border-bottom:1px solid var(--line)}
.rk tr{cursor:pointer}.rk tr:hover td{background:var(--soft)}
.rk .n{color:var(--muted);width:28px}.rk .c{font-weight:800;color:var(--accent);text-align:right}
.rk tr.me td{background:color-mix(in srgb,var(--accent) 16%,#fff)}
.ew{display:grid;grid-template-columns:70px 1fr;gap:6px 8px;align-items:center;font-size:12px;margin-top:8px}
.ew button{border:0;background:none;text-align:left;font-weight:700;font-size:13px;color:var(--ink);padding:0}
.ew .bars div{height:8px;border-radius:4px;margin:3px 0;min-width:2px}
.ew .bars span{font-size:11px;font-weight:500;color:var(--muted)}
.big{font-family:"Montserrat",sans-serif;font-size:52px;font-weight:900;color:var(--accent);text-align:center;margin:6px 0}
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 12px}
.timer i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.clues{list-style:none;padding:0;margin:8px 0}
.clues li{background:var(--soft);border-radius:6px;padding:9px 12px;margin:7px 0;font-size:14px;font-weight:500;border-left:4px solid var(--accent)}
.marker{pointer-events:none}
/* DUEL CSS */
.duel .dscore{align-items:center}
.duel .dflame b{font-family:"Montserrat",sans-serif;font-size:20px}
.duel .dflame.hot{animation:dflame 1s ease-in-out infinite;transform-origin:left center}
.duel .dcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 10px}
.duel .dc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;padding:18px 8px 12px;background:#fff;border:1px solid var(--line);border-top:6px solid var(--cA);border-radius:8px;text-align:center;transition:transform .15s,box-shadow .15s,background .25s,border-color .25s}
.duel .dc.dcB{border-top-color:var(--cB)}
.duel .dc:hover:not(:disabled){transform:translateY(-3px);box-shadow:var(--shadow)}
.duel .dc:active:not(:disabled){transform:scale(.97)}
.duel .dc:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.duel .dc:disabled{cursor:default;color:var(--ink)}
.duel .dc .flag{width:min(96px,70%);height:auto;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.duel .dc .dn{font-size:16px;font-weight:800;line-height:1.25}
.duel .dc .dk{position:absolute;top:6px;left:8px;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.duel .dc .dv{font-family:"Montserrat",sans-serif;font-size:15px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.duel .dc.right{background:var(--good);border-color:var(--good);color:#fff}
.duel .dc.right .dv,.duel .dc.right .dk{color:#fff;border-color:rgba(255,255,255,.5)}
.duel .dc.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.duel .dc.wrong .dv,.duel .dc.wrong .dk{color:#fff;border-color:rgba(255,255,255,.5)}
.duel .dc.dim{opacity:.7}
.duel .dc.pop{animation:dpop .5s cubic-bezier(.2,1.6,.4,1)}
.duel .dc.shake{animation:dshake .45s}
.duel .drev{border-radius:8px;padding:10px 14px;background:var(--soft);border-left:5px solid var(--good)}
.duel .drev.bad{border-left-color:var(--bad)}
.duel .drev.good{animation:dflash .7s}
.duel .drev.bad{animation:dflashbad .7s}
.duel .drev b{font-size:15px}
.duel .drev.good b{color:var(--good)}.duel .drev.bad b{color:var(--bad)}
.duel .drev p{margin:6px 0 0;font-size:14px;line-height:1.5;font-weight:500}
.duel .dhint{text-align:center;margin:4px 0 0}
.duel .dres{margin-top:6px;text-align:center}
.duel .dover{font-weight:800;font-size:16px;color:var(--bad);margin-top:12px}
.duel .drec{font-weight:800;color:var(--accent);margin:4px 0}
@keyframes dpop{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
@keyframes dshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes dflash{0%{background:color-mix(in srgb,var(--good) 45%,#fff)}100%{background:var(--soft)}}
@keyframes dflashbad{0%{background:color-mix(in srgb,var(--bad) 40%,#fff)}100%{background:var(--soft)}}
@keyframes dflame{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (max-width:480px){.duel .dc{min-height:140px;padding:16px 6px 10px}.duel .dc .dn{font-size:14px}.duel .dc .dv{font-size:13px}}
@media (prefers-reduced-motion:reduce){.duel .dc,.duel .dc.pop,.duel .dc.shake,.duel .drev,.duel .dflame.hot{animation:none!important;transition:none!important}}
/* END DUEL CSS */
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.pulse{fill:var(--accent);transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
/* mobile */
@media (min-width:821px){
  .groups{flex-direction:row;flex-wrap:wrap;gap:8px 22px}
  .group{overflow:visible;flex-wrap:wrap}
  .group .glabel{width:auto}
  .chip{padding:5px 13px;min-height:32px}
  #mapwrap{min-height:62vh}
}
@media (max-width:820px){
  body{padding:10px 10px 18px;gap:10px}
  main{flex-direction:column}
  #mapwrap{flex:none;height:52vh;min-height:300px}
  aside#panel{width:auto;padding:0 2px 6px}
  header.hero{padding:14px 16px 18px;gap:18px}
  .hero-top{gap:10px}
  .hero-brand{font-size:13px}

/* ---------- data prep ---------- */
const C = {}; countries.forEach(c => C[c.iso3] = c);

/* ---------- state ---------- */

/* ---------- map ---------- */

const gDots = gRoot.append("g");
const gMarks = gRoot.append("g").attr("class","marker");
const features = topojson.feature(topo, topo.objects.countries).features
  .filter(f => f.properties.name !== "Antarctica" && f.id !== "010");
features.forEach(f => { f.iso = f.id ? NUM2ISO[String(f.id).padStart(3,"0")] : NAME2ISO[f.properties.name]; });
const projection = d3.geoNaturalEarth1();
const path = d3.geoPath(projection);
let W=0,H=0, curK=1;
const countryPaths = gLand.selectAll("path").data(features).join("path")
  .attr("class","country")

let dotData = [];
function layout(){
  W = wrap.clientWidth; H = wrap.clientHeight;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  projection.fitExtent([[6,6],[W-6,H-6]], {type:"FeatureCollection",features});
  countryPaths.attr("d", path);
  // small-country dots: any geometry smaller than threshold in px²
  dotData = [];
  features.forEach(f => {
    if (!f.iso) return;
    const a = path.area(f);
    if (a < 14) { const [x,y] = path.centroid(f); if (isFinite(x)) dotData.push({iso:f.iso,x,y}); }
  });
  (extraPoints||[]).forEach(p => { const xy = projection([p.lon,p.lat]); dotData.push({iso:p.iso3,x:xy[0],y:xy[1]}); });
  gDots.selectAll("circle").data(dotData, d=>d.iso).join("circle")
    .attr("class","smalldot").attr("cx",d=>d.x).attr("cy",d=>d.y)
    .on("click",(e,d)=>onCountry(d.iso))
    .on("mousemove",(e,d)=>showTip(e,d.iso)).on("mouseleave",hideTip);
  sizeDots(); paint();
}
const zoom = d3.zoom().scaleExtent([1,12]).on("zoom", e => { gRoot.attr("transform", e.transform); curK=e.transform.k; sizeDots(); });
svg.call(zoom).on("dblclick.zoom", null);
function sizeDots(){ gArcs.selectAll("path").attr("stroke-width", 1.4/curK); gDots.selectAll("circle").attr("r", d => (d.on ? 5 : 3)/curK);
  gMarks.selectAll("g.mk").attr("transform", d => `translate(${d.x},${d.y}) scale(${1/curK})`); }
document.getElementById("zin").onclick = ()=>svg.transition().duration(300).call(zoom.scaleBy,1.6);
document.getElementById("zout").onclick = ()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.6);
document.getElementById("zreset").onclick = ()=>svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);
function zoomTo(iso){
  const f = features.find(x=>x.iso===iso); let cx,cy,k;
  if (f) { const [[x0,y0],[x1,y1]] = path.bounds(f); cx=(x0+x1)/2; cy=(y0+y1)/2;
    k = Math.min(8, 0.5/Math.max((x1-x0)/W,(y1-y0)/H)); }
  else { const d = dotData.find(x=>x.iso===iso); if(!d) return; cx=d.x; cy=d.y; k=6; }
  k = Math.max(1.5, Math.min(k, 4.5));
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-cx,-cy));
}
new ResizeObserver(()=>layout()).observe(wrap);

/* colour for a country under current state */
function fillFor(iso){
  if (!iso) return "var(--land)";
  if (mode === "myday") return mdFill(iso);
  if (mode === "world100") { const k = w100Cat(iso); return k==="N" ? "var(--land)" : W100COL[k]; }
  if (mode === "rank") { if (rankTab!=="conn") return "var(--land)"; const n = CONN[iso]||0; return n ? connScale(n) : "var(--land)"; }
  if (mode === "quiz" && game === "duel") return duelFill(iso);
  if (mode === "quiz" && game === "guess") { return (guess && guess.answered && guess.iso===iso) ? "var(--cB)" : "var(--land)"; }
  if (mode === "quiz") {
    const q = quiz.cur; if (!q || !quiz.answered) return (q && q.iso===iso) ? "var(--cB)" : "var(--land)";
    if (q.org) { const s=statusOf(q.org,iso); if (s==="member") return "var(--t1)"; }
    return (q.iso===iso) ? "var(--cB)" : "var(--land)";
  }
  if (mode === "compare") {
    const inSel = selected.filter(id => statusOf(id, iso) === "member");
    if (inSel.length === 0) return "var(--land)";
    if (inSel.length >= 2) return "var(--cX)";
    return CMPCOL[selected.indexOf(inSel[0])];
  }
  if (!selected.length) return "var(--land)";
  const s = statusOf(selected[0], iso); if (s === "member") return memberShade(selected[0], iso); return s ? TIERCOL[TIER[s]||2] : "var(--land)";
}
function paint(){
  countryPaths.attr("fill", f => fillFor(f.iso)).classed("sel", f => f.iso && f.iso===focusIso);
  gDots.selectAll("circle")
    .each(d => { d.on = fillFor(d.iso)!=="var(--land)" || d.iso===focusIso; })
    .attr("fill", d => d.on ? fillFor(d.iso) : "#ffffff")
    .attr("opacity", d => d.on ? 1 : (selected.length||mode==="quiz" ? 0.35 : 0.8))
    .attr("stroke", d => d.iso===focusIso ? "#222" : (d.on ? "#fff" : "#9aa0a8"))
    .attr("stroke-width", d => d.iso===focusIso ? 1.8 : (d.on ? 1.4 : 0.8))
    .classed("on", d => d.on);
  drawMarks(); sizeDots(); renderLegend(); drawArcs(); syncSheet();
}

/* ===== VISUAL helpers: shading, arcs, bottom sheet, compact picker ===== */
const VTX = {en:{more:"More",less:"Less",gdpLow:"Smaller GDP",gdpHigh:"Larger GDP"}, zh:{more:"更多組織",less:"收合",gdpLow:"GDP 較小",gdpHigh:"GDP 較大"}};
const VT = k => VTX[lang][k];
const POPULAR = ["g7","g20","apec","wto","eu","un","imf"];
let moreOpen = false, lastArcKey = "", sheetWas = false;
const SHADE = {};
function shadeInfo(id){
  if (SHADE[id]) return SHADE[id];
  const gs = ORG[id].members.filter(m=>m.status==="member").map(m=>(C[m.iso3]||{}).gdp_usd||0).filter(g=>g>0);
  let r = {flat:true};
  if (gs.length >= 4) { const lo = Math.log(Math.min(...gs)), hi = Math.log(Math.max(...gs)); r = {lo, hi, flat: hi-lo < 0.3}; }
  return SHADE[id] = r;
}
function memberShade(id, iso){
  const s = shadeInfo(id); if (s.flat) return "var(--t1)";
  const g = (C[iso]||{}).gdp_usd; let k = g>0 ? (Math.log(g)-s.lo)/(s.hi-s.lo) : 0; k = Math.max(0, Math.min(1, k));
  return `color-mix(in srgb,var(--accent) ${Math.round(28+72*k)}%,#fff)`;
}
function bigNum(s){ const m = String(s).match(/^(US\$\s*)?([\d.,]+)\s*(.*)$/); if (!m) return `<b>${esc(s)}</b>`; return `<b>${m[2]}<em>${esc(((m[3]||"")+(m[1]?" US$":"")).trim())}</em></b>`; }
function bigMember(id){
  let best = null, bg = -1; ORG[id].members.forEach(m => { const g = (C[m.iso3]||{}).gdp_usd||0; if (m.status==="member" && g>bg) { bg=g; best=m.iso3; } });
  return best;
}
/* centroid of a country's largest polygon (so France/USA/Norway don't point into the sea) */
let centKey = "", CENT = {};
function centroidOf(iso){
  const k = W+"x"+H; if (k !== centKey) { centKey = k; CENT = {}; }
  if (iso in CENT) return CENT[iso];
  const f = features.find(x => x.iso === iso); let p = null;
  if (f) {
    const g = f.geometry;
    if (g.type === "MultiPolygon") { let best = -1; g.coordinates.forEach(c => { const pf = {type:"Polygon", coordinates:c}; const a = path.area(pf); if (a > best) { best = a; p = path.centroid(pf); } }); }
    else p = path.centroid(f);
  }
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) { const d = dotData.find(x => x.iso === iso); p = d ? [d.x, d.y] : null; }
  return CENT[iso] = p;
}
function arcTargets(){
  const gd = i => (C[i]||{}).gdp_usd||0; let tg = [];
  if (selected[0] && statusOf(selected[0], focusIso) === "member") tg = ORG[selected[0]].members.filter(m=>m.status==="member").map(m=>m.iso3);
  else {
    const sc = {};
    (MEMB[focusIso]||[]).filter(x => x.status==="member" && x.id!=="taiwan_allies" && ORG[x.id].members.length <= 60)
      .forEach(x => ORG[x.id].members.forEach(m => { if (m.status==="member") sc[m.iso3] = (sc[m.iso3]||0)+1; }));
    tg = Object.keys(sc).sort((a,b) => sc[b]-sc[a] || gd(b)-gd(a));
  }
  return tg.filter(i => i!==focusIso && C[i] && centroidOf(i)).sort((a,b) => gd(b)-gd(a)).slice(0,60);
}
function drawArcs(){
  const key = [mode, focusIso, selected[0], W, H].join("|");
  if (key === lastArcKey) return; lastArcKey = key;
  gArcs.selectAll("*").remove();
  if (mode !== "explore" || !focusIso || !C[focusIso]) return;
  const src = centroidOf(focusIso); if (!src) return;
  arcTargets().forEach((iso, i) => {
    const p = centroidOf(iso), dx = p[0]-src[0], dy = p[1]-src[1], dist = Math.hypot(dx, dy); if (dist < 4) return;
    const mx = (src[0]+p[0])/2, my = (src[1]+p[1])/2 - dist*0.35;
    gArcs.append("path").attr("class","arc").attr("pathLength",1).attr("stroke-width",1.4/curK)
      .attr("d", `M${src[0]},${src[1]}Q${mx},${my} ${p[0]},${p[1]}`).style("animation-delay", (i*12)+"ms");
  });
}
function syncSheet(){
  const p = document.getElementById("panel");
  const on = window.innerWidth <= 820 && !!focusIso && (mode==="explore" || mode==="compare" || mode==="rank");
  p.classList.toggle("sheet", on); document.body.classList.toggle("sheet-open", on);
  if (on && !sheetWas) { const y = wrap.getBoundingClientRect().top + window.scrollY - 56; window.scrollTo({top:Math.max(0,y), behavior:"smooth"}); }
  sheetWas = on;
}
(function(){
  const p = document.getElementById("panel"); let y0 = null;
  p.addEventListener("touchstart", e => { y0 = (p.classList.contains("sheet") && p.scrollTop <= 0) ? e.touches[0].clientY : null; }, {passive:true});
  p.addEventListener("touchend", e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy > 80) { focusIso = null; paint(); renderPanel(); } }, {passive:true});

/* tooltip */
const tip = document.getElementById("tip");
function showTip(e, iso){

/* ---------- legend ---------- */
function renderLegend(){
  const el = document.getElementById("legend"); let h = "";
  if (mode === "rank" && rankTab === "conn") { h = `<div style="display:block">${t("memberships")}</div><div><i style="background:${connScale(1)}"></i>1</div><div><i style="background:${connScale(Math.round(CONN_MAX/2))}"></i>${Math.round(CONN_MAX/2)}</div><div><i style="background:${connScale(CONN_MAX)}"></i>${CONN_MAX}</div>`; }
  if (mode === "explore" && selected[0]) {
    const o = ORG[selected[0]]; const used = [...new Set(o.members.map(m=>m.status))]
      .sort((a,b)=>(TIER[a]||2)-(TIER[b]||2));
    used.forEach(s => { h += `<div><i style="background:${s==="member" ? memberShade(o.id, bigMember(o.id)) : TIERCOL[TIER[s]||2]}"></i>${L(o.status_labels[s])} (${o.members.filter(m=>m.status===s).length})</div>`;
      if (s==="member" && o.members.filter(m=>m.status==="member").length>=4) h += `<div style="display:block;margin:0 0 4px"><i class="gradbar"></i><p class="gradlbl"><span>${VT("gdpLow")}</span><span>${VT("gdpHigh")}</span></p></div>`; });
    h += `<div><i style="background:var(--land)"></i>${t("nonMember")}</div>`;
  } else if (mode === "compare" && selected.length) {
    selected.forEach((id,i)=>{ h += `<div><i style="background:${CMPCOL[i]}"></i>${ORG[id].abbr} ${selected.length>1?t("only"):""}</div>`; });
    if (selected.length>1) h += `<div><i style="background:var(--cX)"></i>${t("inBoth")}</div>`;
  } else if (mode === "world100") {
    h = `<div><i style="background:${W100COL.A}"></i>${ORG[W100.a].abbr}</div>` + (W100.b ? `<div><i style="background:${W100COL.B}"></i>${ORG[W100.b].abbr}</div><div><i style="background:${W100COL.X}"></i>${t("w100Overlap")}</div>` : "") + `<div><i style="background:var(--land)"></i>${t("nonMember")}</div>`;
  } else if (mode === "quiz" && quiz.cur && quiz.answered && quiz.cur.org) {
    h = `<div><i style="background:var(--t1)"></i>${ORG[quiz.cur.org].abbr}</div><div><i style="background:var(--cB)"></i>${cname(quiz.cur.iso)}</div>`;
  }
  if (mode === "myday") h = mdLegend();
  el.innerHTML = h; el.style.display = h ? "block" : "none";
}

/* ---------- org chips ---------- */
function renderGroups(){
  const g = document.getElementById("groups"); g.innerHTML = "";
  if (mode === "quiz" || mode === "rank" || mode === "world100" || mode === "myday") { g.style.display="none"; return; } g.style.display="";
  if (mode === "compare") {
    const row = document.createElement("div"); row.className = "presets";
    row.innerHTML = `<span class="glabel" style="align-self:center;font-size:11px;color:var(--muted);flex-shrink:0">${t("rivals")}</span>` +
      PRESETS.filter(p=>p.ids.every(id=>ORG[id])).map((p,i)=>`<button data-preset="${i}" title="${esc(L(p.why))}">${p.ids.map(id=>ORG[id].abbr).join(" vs ")}</button>`).join("");
    row.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { const p = PRESETS[+b.dataset.preset]; selected = p.ids.slice(); presetWhy = p; focusIso=null; renderGroups(); paint(); renderPanel(); svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity); });
    g.appendChild(row);
  }
  /* compact picker: popular chips + "More" dropdown with every category */
  const mkChip = o => {
    const b = document.createElement("button"); b.className = "chip"; const idx = selected.indexOf(o.id);
    if (idx>=0) b.classList.add("on");
    b.innerHTML = (mode==="compare" && idx>=0 ? `<span class="dot" style="background:${CMPCOL[idx]}"></span>` : "") + o.abbr;
    b.title = L(o.name);
    b.onclick = () => { toggleOrg(o.id); if (mode==="explore") moreOpen = false, renderGroups(); };
    return b;
  };
  const pop = document.createElement("div"); pop.className = "group pop";
  const popIds = POPULAR.filter(id => ORG[id]); selected.forEach(id => { if (!popIds.includes(id)) popIds.push(id); });
  popIds.forEach(id => pop.appendChild(mkChip(ORG[id])));
  const more = document.createElement("button"); more.className = "chip more" + (moreOpen ? " on" : "");
  more.innerHTML = `${VT(moreOpen ? "less" : "more")}<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l4 4 4-4"/></svg>`;
  more.onclick = e => { e.stopPropagation(); moreOpen = !moreOpen; renderGroups(); };
  pop.appendChild(more); g.appendChild(pop);
  const box = document.createElement("div"); box.className = "morebox" + (moreOpen ? " open" : ""); box.onclick = e => e.stopPropagation();
  CAT_ORDER.forEach(cat => {
    const list = orgs.filter(o=>o.category===cat); if (!list.length) return;
    const row = document.createElement("div"); row.className="group";
    row.innerHTML = `<span class="glabel">${t("cat")[cat]}</span>`;
    list.forEach(o => row.appendChild(mkChip(o)));

  });
  g.appendChild(box);
}
function toggleOrg(id){
  if (mode === "explore") { selected = selected[0]===id ? [] : [id]; focusIso = null; }
  else {

/* ---------- quiz ---------- */
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const quizOrgs = () => orgs.filter(o => o.members.filter(m=>m.status==="member").length >= 3 && o.id!=="un");
const memberSet = id => new Set(ORG[id].members.filter(m=>m.status==="member").map(m=>m.iso3));
function makeQ(){
  const type = pick([1,1,2,3]);
  const qo = quizOrgs();
  if (type===1) {
    const o = pick(qo); const ms = memberSet(o.id); const yes = Math.random()<0.5;
    let iso;
    if (yes) iso = pick([...ms]);
    else { const near = Object.keys(MEMB).filter(i => !ms.has(i) && C[i] && (MEMB[i]||[]).length>=4); iso = pick(near.length?near:Object.keys(C).filter(i=>!ms.has(i))); }
    return {type, org:o.id, iso, opts:[{k:"yes",l:t("yes"),ok:yes},{k:"no",l:t("no"),ok:!yes}]};
  }
  if (type===2) {
    const cands = Object.keys(MEMB).filter(i => C[i] && MEMB[i].some(x=>x.status==="member" && x.id!=="un" && x.id!=="wto" && x.id!=="imf"));
    const iso = pick(cands);
    const right = pick(MEMB[iso].filter(x=>x.status==="member" && !["un","wto","imf"].includes(x.id))).id;
    const wrongs = shuffle(qo.filter(o => statusOf(o.id, iso)!=="member").map(o=>o.id)).slice(0,3);
    if (wrongs.length<3) return makeQ();
    return {type, iso, org:right, opts:shuffle([right,...wrongs]).map(id=>({k:id,l:ORG[id].abbr+" — "+L(ORG[id].name),ok:id===right}))};
  }
  const o = pick(qo.filter(o=>memberSet(o.id).size<=60)); const ms = memberSet(o.id);
  const right = pick([...ms]);
  const pool = shuffle(Object.keys(C).filter(i=>!ms.has(i) && C[i].population>1e6)).slice(0,3);
  return {type, org:o.id, iso:right, opts:shuffle([right,...pool]).map(i=>({k:i,l:cname(i,o.id),ok:i===right}))};
}
function qText(q){
  if (q.type===1) return t("q1")(cname(q.iso,q.org), ORG[q.org].abbr);
  if (q.type===2) return t("q2")(cname(q.iso));
  return t("q3")(ORG[q.org].abbr+(lang==="zh"?"（"+L(ORG[q.org].name)+"）":" ("+L(ORG[q.org].name)+")"));
}
function quizCard(){
  const tabs = `<div class="subtabs">${["classic","blitz","guess","duel"].map(g=>`<button data-game="${g}" class="${g===game?"on":""}">${t(g)}</button>`).join("")}</div>`;
  if (game === "blitz") return `<div class="card quiz">${tabs}${blitzBody()}</div>`;
  if (game === "guess") return `<div class="card quiz">${tabs}${guessBody()}</div>`;
  if (game === "duel") return `<div class="card quiz duel">${tabs}${duelBody()}</div>`;
  return quizClassic(tabs);
}
function quizClassic(tabs){
  if (!quiz.cur) nextQ(true);
  const q = quiz.cur;
  let h = `<div class="card quiz">${tabs}<div class="score"><span>${t("score")} <b>${quiz.score}/${quiz.total}</b></span><span>${t("streak")} <b>${quiz.streak}</b></span></div>
    <div class="q">${esc(qText(q))}</div><div class="opts">`;
  q.opts.forEach(o => { let cls=""; if (quiz.answered) { if (o.ok) cls="right"; else if (o.k===quiz.picked) cls="wrong"; }
    h += `<button data-ans="${esc(o.k)}" class="${cls}" ${quiz.answered?"disabled":""}>${esc(o.l)}</button>`; });
  h += `</div><div class="fb">${quiz.answered ? (quiz.lastOk?`<b style="color:var(--good)">${t("correct")}</b>`:`<b style="color:var(--bad)">${t("wrong")}</b>`) + " " + esc(explain(q)) : ""}</div>`;
  if (quiz.answered) h += `<button class="primary" data-next>${t("next")} →</button>`;
  return h + `</div>`;
}
function explain(q){
  const o = ORG[q.org]; const n = memberSet(q.org).size;
  return lang==="zh" ? `${o.abbr} 目前有 ${n} 個正式成員國，已在地圖上以深藍色標出。` : `${o.abbr} has ${n} full member countries, shown in dark blue on the map.`;
}
function answer(k, btn){
  if (game === "blitz") return blitzAnswer(k, btn);
  if (game === "duel") return duelAnswer(k);
  if (game === "guess") return guessAnswer(k);
  if (quiz.answered) return; const q = quiz.cur; const opt = q.opts.find(o=>o.k===k);
  quiz.answered = true; quiz.picked = k; quiz.total++; quiz.lastOk = opt.ok;
  if (opt.ok) { quiz.score++; quiz.streak++; } else quiz.streak = 0;
  paint(); renderPanel();

}

/* ---------- dates & countdown ---------- */
function pd(str, end){
  if (!str) return null; const [y,m,d] = str.split("-").map(Number);
  if (!m) return end ? new Date(y,11,31) : new Date(y,0,1);
  if (!d) return end ? new Date(y,m,0) : new Date(y,m-1,1);
  return new Date(y,m-1,d);
}
function meetState(m){
  const now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const s = pd(m.date_start), e = pd(m.date_end || m.date_start, true);
  const days = Math.round((s - t0)/864e5);
  let state = days > 0 ? "future" : (e >= t0 ? "now" : "past");
  if (state === "now" && !precise(m)) state = "future";   // only month/year known: don't claim it is happening now
  return {days, state, start:s};
}
function fmtDate(m){
  const p = m.date_precision || (m.date_start.length===10 ? "day" : m.date_start.length===7 ? "month" : "year");
  const s = pd(m.date_start), e = m.date_end ? pd(m.date_end) : null;
  if (p === "year") return lang==="zh" ? `${s.getFullYear()} 年` : `${s.getFullYear()}`;

function newGuess(tries){
  const GENERIC = ["un","imf","wto","taiwan_allies"];

  const mem = orgs.filter(o => !GENERIC.includes(o.id) && statusOf(o.id, iso) === "member")
    .sort((a,b) => b.members.length - a.members.length);           // broad -> specific
  if (mem.length < 3 && (tries||0) < 30) return newGuess((tries||0)+1);
  let picks = mem;
  if (mem.length > 4) picks = [...new Set([0,1,2,3].map(i => mem[Math.round(i*(mem.length-1)/3)]))];
  const clues = picks.map(o => ({type:"org", id:o.id}));

  // distractors: share as many clues as possible (all but the most specific one ideally)
  const score = i => picks.reduce((s,o) => s + (statusOf(o.id,i)==="member"?1:0), 0);
  const cands = shuffle(Object.keys(C).filter(i => i !== iso && score(i) >= 1)).sort((a,b) => score(b) - score(a));

/* ---------- world100 ---------- */
const W100 = {a:"g7", b:"", timers:[], raf:[]};
const W100COL = {A:"var(--accent)", B:"#3B82C4", X:"var(--char)", N:"#d3d6db"};
const W100_ORG_OK = id => ORG[id] && (ORG[id].members||[]).some(m=>m.status==="member");
function w100Cat(iso){ // A, B, X (both), N
  const a = W100.a && statusOf(W100.a, iso)==="member", b = W100.b && statusOf(W100.b, iso)==="member";
  return a&&b ? "X" : a ? "A" : b ? "B" : "N";
}
function w100Alloc(vals){ // largest remainder, sums to 100 exactly
  const tot = Object.values(vals).reduce((s,v)=>s+v,0) || 1;
  const keys = Object.keys(vals), raw = keys.map(k=>vals[k]/tot*100), fl = raw.map(Math.floor);
  let left = 100 - fl.reduce((s,v)=>s+v,0);
  keys.map((k,i)=>[i, raw[i]-fl[i]]).sort((x,y)=>y[1]-x[1]).forEach(([i])=>{ if (left>0) { fl[i]++; left--; } });
  const o = {}; keys.forEach((k,i)=>o[k]=fl[i]); return o;
}
function w100Calc(){
  const pop={A:0,B:0,X:0,N:0}, gdp={A:0,B:0,X:0,N:0}, list={A:[],B:[],X:[],N:[]};
  Object.keys(C).forEach(iso=>{ const c=C[iso]; if(!c) return; const k=w100Cat(iso);
    pop[k]+=c.population||0; gdp[k]+=c.gdp_usd||0; list[k].push(iso); });
  const sum = o => o.A+o.B+o.X+o.N;
  const tp = sum(pop)||1, tg = sum(gdp)||1;
  return {pop, gdp, list, tp, tg, np: w100Alloc(pop), ng: w100Alloc(gdp),
    pShare: k=>(pop[k]+(k==="A"?pop.X:0))/tp, gShare:k=>(gdp[k]+(k==="A"?gdp.X:0))/tg};
}
function w100Insight(r){
  const A = W100.a && ORG[W100.a]; if (!A) return "";
  const pS=(r.pop.A+r.pop.X)/r.tp, gS=(r.gdp.A+r.gdp.X)/r.tg, rt = pS>0 ? gS/pS : 0;
  const nm = A.abbr, f1 = x=>x.toFixed(1);
  const pc = Math.round(pS*100), gc = Math.round(gS*100);
  let s;
  if (!pS) return lang==="zh" ? `${nm} 沒有可計算的正式成員資料。` : `No full-member data available for ${nm}.`;
  if (rt >= 1.1) s = lang==="zh"
    ? `${nm} 約佔世界人口 ${pc}%，卻創造約 ${gc}% 的 GDP：平均每位成員國居民「扛著」世界平均 GDP 的 ${f1(rt)} 倍。`
    : `${nm} holds about ${pc}% of the world's people but about ${gc}% of its GDP: each ${nm} person "carries" ${f1(rt)}x the world-average GDP.`;
  else if (rt <= 0.9) s = lang==="zh"
    ? `${nm} 約佔世界人口 ${pc}%，但只佔約 ${gc}% 的 GDP：平均每人只有世界平均 GDP 的 ${f1(rt)} 倍。`
    : `${nm} holds about ${pc}% of the world's people but only about ${gc}% of its GDP: each person has just ${f1(rt)}x the world-average GDP.`;
  else s = lang==="zh"
    ? `${nm} 的人口占比（約 ${pc}%）與 GDP 占比（約 ${gc}%）相近，平均每人約等於世界平均（${f1(rt)} 倍）。`
    : `${nm}'s share of population (~${pc}%) and GDP (~${gc}%) are about equal: each person is near the world average (${f1(rt)}x).`;
  if (pS > 0.5) s += lang==="zh" ? ` 全球過半人口都在這個組織裡。` : ` More than half of humanity lives in this group.`;
  return s;
}
const W100_NAMES = {A:()=>W100.a?ORG[W100.a].abbr:"", B:()=>W100.b?ORG[W100.b].abbr:"", X:()=>`${ORG[W100.a].abbr} ∩ ${ORG[W100.b].abbr}`, N:()=>t("w100Rest")};

  const x = Math.max(-1, Math.min(1, Math.log2(r)/3)), k = Math.pow(Math.abs(x), .85), tg = x>=0 ? MD_UP : MD_DN;
  return `rgb(${MD_NEU.map((n,i)=>Math.round(n+(tg[i]-n)*k)).join(",")})`;
}
function mdLegend(){
  const g = `linear-gradient(90deg,rgb(${MD_DN}),rgb(${MD_NEU}),rgb(${MD_UP}))`;
  return `<div style="display:block;max-width:230px;line-height:1.35">${lang==="zh"?"你的收入 ÷ 當地平均每人所得":"Your income ÷ local average"}</div>
  <div style="display:block"><i style="display:block;width:170px;max-width:100%;height:10px;background:${g}"></i>
  <span style="display:flex;justify-content:space-between;width:170px;max-width:100%;font-size:11px;color:var(--muted);margin-top:2px"><span>≤ 1/8×</span><span>1×</span><span>≥ 8×</span></span></div>`;
}
function mdTip(iso){ const r = mdRatio(iso); if (r==null || mdAmt()<=0) return ""; return ` · ${r>=10?r.toFixed(0):r.toFixed(r>=1?1:2)}×`; }
const mdRStr = r => r>=10 ? Math.round(r).toString() : r>=1 ? r.toFixed(1) : r.toFixed(2);
const mdVerdict = r => r>=3 ? 0 : r>=1.3 ? 1 : r>0.77 ? 2 : r>0.33 ? 3 : 4;
const MD_VCOL = ["#2b6cb0","#3b86c4","#7a7f87","#d98a3d","#dd6b20"];
function mdCard(){
  const cur = mdCur();
  return `<div class="card md"><h2>${mt("title")}</h2><p class="sub">${mt("sub")}</p><p class="note" style="margin-top:6px">${mt("intro")}</p>
  <label class="mdl" for="mdAmt">${mt("amt")}</label>
  <div class="mdrow"><div class="mdinp"><span id="mdSym">${cur==="TWD"?"NT$":"US$"}</span><input id="mdAmt" inputmode="numeric" autocomplete="off" value="${mdAmt().toLocaleString("en-US")}"></div>
    <div class="mdseg" role="group"><button data-mdcur="TWD" class="${cur==="TWD"?"on":""}">TWD</button><button data-mdcur="USD" class="${cur==="USD"?"on":""}">USD</button></div></div>
  <div class="mdpre" id="mdPre"></div>
  ${mdHasPPP() ? `<div class="mdl" style="margin-top:10px">${mt("basisL")}</div><div class="mdseg mdseg2" role="group"><button data-mdb="ppp" class="${mdBasis()==="ppp"?"on":""}">${mt("ppp")}</button><button data-mdb="nom" class="${mdBasis()==="nom"?"on":""}">${mt("nom")}</button></div>` : ""}
  <div id="mdOut"></div>
  <p class="note mdfoot">${mt("rate")} <input id="mdRate" class="mdrate" inputmode="decimal" value="${md.rate}"> ${mt("rateN")}${mdHasPPP()?`<br>${mt("src")}: ${esc(DATA.ppp.source||"IMF")} (${DATA.ppp.year||""}).`:""}</p></div>`;
}
function mdPresetsHtml(){
  const cur = mdCur(), pre = cur==="TWD" ? [5000,30000,60000,100000] : [150,1000,2000,3500];
  return `<span class="mdl" style="margin:0 4px 0 0">${mt("pre")}</span>` + pre.map(v=>`<button class="chip mdp ${mdAmt()===v?"on":""}" data-mdp="${v}">${cur==="TWD"?"NT$":"US$"}${v.toLocaleString("en-US")}</button>`).join("");
}
function mdStrip(st){
  const d = mdData(), arr = d.arr, lo = Math.log(arr[0].v), hi = Math.log(arr[arr.length-1].v), y = mdUSDy();
  const bars = arr.map(a => { const h = 8 + 92*(Math.log(a.v)-lo)/(hi-lo);
    return `<i class="mdb ${a.v<y?"lo":""} ${a.iso===md.sel?"sel":""}" data-mdiso="${a.iso}" style="height:${h.toFixed(1)}%" title="${esc(cname(a.iso))} · ${mdFmtUSD(a.v)}"></i>`; }).join("");
  const pos = Math.max(3, Math.min(97, st.n/st.m*100));
  return `<div class="mdstrip"><div class="mdbars">${bars}</div><div class="mdyou" style="left:${pos}%"><span>${mt("you")}</span></div></div>
  <div class="mdends"><span>${mt("low")}: ${esc(cname(arr[0].iso))}</span><span>${mt("high")}: ${esc(cname(arr[arr.length-1].iso))}</span></div>`;
}
function mdOutHtml(){
  const amt = mdAmt(); if (!(amt>0)) return `<p class="note" style="margin-top:14px">${mt("zero")}</p>`;
  const st = mdStand(), d = mdData(), cur = mdCur(), y = mdUSDy();
  let h = `<div class="mdhead"><div class="mdbig">${mt("head")(st.n, st.m)}</div>
    <div class="note" style="margin:2px 0 0">${mt("pct")(Math.round(st.n/st.m*100))} · ${mt("asm")} ${mdFmtCur(amt,cur)}${cur==="TWD"?` ≈ ${mdFmtUSD(mdUSDm())}`:""} · ${mdFmtUSD(y)} ${mt("perY")}</div></div>
    <h3 style="margin-top:14px">${mt("ladder")}</h3>${mdStrip(st)}
    <h3 style="margin-top:14px">${mt("pick")}</h3>
    <select id="mdSel" class="mdsel"><option value="">${mt("choose")}</option>${[...d.arr].sort((a,b)=>cname(a.iso).localeCompare(cname(b.iso), lang==="zh"?"zh-Hant":"en")).map(a=>`<option value="${a.iso}" ${a.iso===md.sel?"selected":""}>${esc(cname(a.iso))}</option>`).join("")}</select>
    <div class="mdquick">${mt("quick")} ${["USA","JPN","CHE","IND","NGA","LUX"].filter(i=>d.v[i]).map(i=>`<button class="chip mdp" data-mdiso="${i}">${flagImg(i)}${esc(cname(i))}</button>`).join("")}</div>`;
  if (md.sel && d.v[md.sel]) {
    const r = y/d.v[md.sel], vi = mdVerdict(r), c = md.sel;
    h += `<div class="mdcty" style="border-left-color:${MD_VCOL[vi]}"><div class="ctitle">${flagImg(c)}<div><b style="font-size:17px">${esc(cname(c))}</b><div class="note" style="margin:0">${mt("avgIs")(mdFmtUSD(d.v[c]))}</div></div></div>
      <div class="mdx"><span class="mdxn">${mdRStr(r)}</span><span class="mdxl">${mt("x")}</span></div>
      <div class="note" style="margin:0;font-size:13px"><b style="color:${MD_VCOL[vi]}">${mt("v")[vi]}</b> · ${mt("ofavg")(Math.round(r*100).toLocaleString("en-US"))}</div></div>`;
  } else h += `<p class="note">${mt("tapmap")}</p>`;
  const near = d.arr.map(a=>({iso:a.iso, r:y/a.v})).sort((a,b)=>Math.abs(Math.log(a.r))-Math.abs(Math.log(b.r))).slice(0,3);
  h += `<h3 style="margin-top:14px">${mt("close")}</h3><div class="note" style="margin:0 0 6px">${mt("closeS")}</div><div class="mdquick">` +
    near.map(n=>`<button class="chip mdp" data-mdiso="${n.iso}">${flagImg(n.iso)}${esc(cname(n.iso))} <b>${mdRStr(n.r)}×</b></button>`).join("") + `</div>`;
  const lo = d.arr[0], hi = d.arr[d.arr.length-1];
  h += `<p class="mdedu">${mt("gap")(mdFmtUSD(lo.v), cname(lo.iso), mdFmtUSD(hi.v), cname(hi.iso), Math.round(hi.v/lo.v))}</p>
    <p class="note">${mt(mdBasis()==="ppp"?"cavP":"cavN")}</p>`;
  return h;
}
let mdAnimN = 0;
function mdRefresh(){
  const out = document.getElementById("mdOut"); if (!out) return;
  out.innerHTML = mdOutHtml();
  const pre = document.getElementById("mdPre"); if (pre) pre.innerHTML = mdPresetsHtml();
  mdBindOut(); mdBindPre();
  const n = out.querySelector(".mdn");
  if (n) { const to = mdStand().n, from = mdAnimN; mdAnimN = to;
    if (mdReduced() || from===to) n.textContent = to;
    else { const t0 = performance.now(), dur = 650; n.textContent = from;
      const step = now => { const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3); if (!n.isConnected) return; n.textContent = Math.round(from+(to-from)*e); if (k<1) requestAnimationFrame(step); };
      requestAnimationFrame(step); } }
  focusIso = md.sel; paint();
}
function mdPick(iso){
  if (!mdData().v[iso]) { md.sel = null; mdRefresh(); focusIso = iso; paint(); const o=document.getElementById("mdOut"); if (o) o.insertAdjacentHTML("afterbegin", `<p class="note" style="color:var(--ink)">${esc(cname(iso))}: ${mt("noData")}</p>`); return; }
  md.sel = iso; mdSave(); mdRefresh();
  const el = document.querySelector(".mdcty"); if (el && window.innerWidth <= 820) el.scrollIntoView({behavior: mdReduced()?"auto":"smooth", block:"nearest"});
}
function mdBindOut(){
  const p = document.getElementById("mdOut");
  p.querySelectorAll("[data-mdiso]").forEach(b => b.onclick = () => { mdPick(b.dataset.mdiso); zoomTo(b.dataset.mdiso); });
  const s = document.getElementById("mdSel"); if (s) s.onchange = () => { if (s.value) { mdPick(s.value); zoomTo(s.value); } else { md.sel=null; mdSave(); mdRefresh(); } };
}
function mdSetAmt(v){ md.amt = v; if (md.cur==null) md.cur = mdCur(); mdSave(); }
function mdBindPre(){
  document.querySelectorAll("[data-mdp]").forEach(b => b.onclick = () => { mdSetAmt(+b.dataset.mdp); const i=document.getElementById("mdAmt"); if (i) i.value = md.amt.toLocaleString("en-US"); mdRefresh(); });
}
function mdBind(){
  const inp = document.getElementById("mdAmt"); if (!inp) return;
  inp.oninput = () => { const raw = inp.value.replace(/[^\d]/g,"").slice(0,9); const v = raw===""?0:+raw; inp.value = raw===""?"":v.toLocaleString("en-US"); mdSetAmt(v); mdRefresh(); };
  document.querySelectorAll("[data-mdcur]").forEach(b => b.onclick = () => { const to = b.dataset.mdcur, from = mdCur(); if (to===from) return;
    const usd = from==="TWD" ? mdAmt()/md.rate : mdAmt(), nv = to==="TWD" ? usd*md.rate : usd;
    const sig = Math.pow(10, Math.max(0, Math.floor(Math.log10(Math.max(nv,1)))-2));
    md.cur = to; md.amt = Math.round(nv/sig)*sig; mdSave(); renderPanel(); });
  document.querySelectorAll("[data-mdb]").forEach(b => b.onclick = () => { md.basis = b.dataset.mdb; mdSave(); renderPanel(); });
  const rt = document.getElementById("mdRate"); if (rt) rt.onchange = () => { const v = parseFloat(rt.value); if (v>0 && v<1000) { md.rate = v; mdSave(); mdRefresh(); } else rt.value = md.rate; };
  mdAnimN = mdStand().n; mdRefresh();
}
/* END myday */
/* ================= END PHASE 2 ================= */

setLang(lang); setMode("explore"); layout();
})();
</script>
</body>
